<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Calendar Icon -->
  <g transform="translate(12, 14)">
    <!-- Calendar Body -->
    <rect x="0" y="8" width="40" height="32" rx="4" fill="white" opacity="0.98"/>
    
    <!-- Calendar Header Bar -->
    <rect x="0" y="8" width="40" height="10" rx="4" fill="white"/>
    <rect x="0" y="12" width="40" height="6" fill="#f0fdfa"/>
    
    <!-- Top Binding Rings -->
    <rect x="8" y="3" width="5" height="10" rx="2.5" fill="white"/>
    <rect x="27" y="3" width="5" height="10" rx="2.5" fill="white"/>
    
    <!-- Date Grid (3x3) -->
    <circle cx="10" cy="24" r="2.5" fill="#14b8a6" opacity="0.8"/>
    <circle cx="20" cy="24" r="2.5" fill="#14b8a6" opacity="0.8"/>
    <circle cx="30" cy="24" r="2.5" fill="#14b8a6" opacity="0.8"/>
    
    <circle cx="10" cy="32" r="2.5" fill="#06b6d4" opacity="0.8"/>
    <circle cx="30" cy="32" r="2.5" fill="#06b6d4" opacity="0.8"/>
    
    <!-- Highlighted Date with Checkmark -->
    <circle cx="20" cy="32" r="5" fill="#a855f7"/>
    <path d="M 17.5 32 L 19 33.5 L 22.5 30" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
