<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect width="192" height="192" rx="42" fill="url(#grad192)"/>
  
  <!-- Calendar Icon -->
  <g transform="translate(36, 42)">
    <!-- Calendar Body -->
    <rect x="0" y="24" width="120" height="96" rx="12" fill="white" opacity="0.98"/>
    
    <!-- Calendar Header Bar -->
    <rect x="0" y="24" width="120" height="30" rx="12" fill="white"/>
    <rect x="0" y="36" width="120" height="18" fill="#f0fdfa"/>
    
    <!-- Top Binding Rings -->
    <rect x="24" y="9" width="15" height="30" rx="7.5" fill="white"/>
    <rect x="81" y="9" width="15" height="30" rx="7.5" fill="white"/>
    
    <!-- Date Grid (3x3) -->
    <circle cx="30" cy="72" r="7.5" fill="#14b8a6" opacity="0.8"/>
    <circle cx="60" cy="72" r="7.5" fill="#14b8a6" opacity="0.8"/>
    <circle cx="90" cy="72" r="7.5" fill="#14b8a6" opacity="0.8"/>
    
    <circle cx="30" cy="96" r="7.5" fill="#06b6d4" opacity="0.8"/>
    <circle cx="90" cy="96" r="7.5" fill="#06b6d4" opacity="0.8"/>
    
    <!-- Highlighted Date with Checkmark -->
    <circle cx="60" cy="96" r="15" fill="#a855f7"/>
    <path d="M 52.5 96 L 57 100.5 L 67.5 90" stroke="white" stroke-width="5.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
