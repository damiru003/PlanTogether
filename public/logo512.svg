<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#grad512)"/>
  
  <!-- Calendar Icon -->
  <g transform="translate(96, 112)">
    <!-- Calendar Body -->
    <rect x="0" y="64" width="320" height="256" rx="32" fill="white" opacity="0.98"/>
    
    <!-- Calendar Header Bar -->
    <rect x="0" y="64" width="320" height="80" rx="32" fill="white"/>
    <rect x="0" y="96" width="320" height="48" fill="#f0fdfa"/>
    
    <!-- Top Binding Rings -->
    <rect x="64" y="24" width="40" height="80" rx="20" fill="white"/>
    <rect x="216" y="24" width="40" height="80" rx="20" fill="white"/>
    
    <!-- Date Grid (3x3) -->
    <circle cx="80" cy="192" r="20" fill="#14b8a6" opacity="0.8"/>
    <circle cx="160" cy="192" r="20" fill="#14b8a6" opacity="0.8"/>
    <circle cx="240" cy="192" r="20" fill="#14b8a6" opacity="0.8"/>
    
    <circle cx="80" cy="256" r="20" fill="#06b6d4" opacity="0.8"/>
    <circle cx="240" cy="256" r="20" fill="#06b6d4" opacity="0.8"/>
    
    <!-- Highlighted Date with Checkmark -->
    <circle cx="160" cy="256" r="40" fill="#a855f7"/>
    <path d="M 140 256 L 152 268 L 180 240" stroke="white" stroke-width="14.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
